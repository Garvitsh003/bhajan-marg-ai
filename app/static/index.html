<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bhajan Marg AI</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:#fbf7ef;color:#23180f}
    .wrap{max-width:920px;margin:0 auto;padding:32px 18px 80px}.hero{text-align:center;margin:20px 0 34px}
    h1{font-size:38px;margin:0}.sub{opacity:.7;margin-top:8px}.chat{display:flex;flex-direction:column;gap:18px}
    .msg{padding:18px 20px;border-radius:18px;line-height:1.65;white-space:pre-wrap}.user{align-self:flex-end;background:#3b2818;color:#fff;max-width:75%}
    .ai{background:#fff;border:1px solid #eadfce;box-shadow:0 8px 30px rgba(60,35,12,.05)}
    .badge{font-size:12px;font-weight:700;display:inline-block;padding:5px 9px;border-radius:999px;margin-bottom:10px;background:#f1e3c9}
    .source{margin-top:12px;padding:14px;background:#fffaf0;border:1px solid #ead9b8;border-radius:14px}
    .source a{color:#8c4b00;font-weight:700;text-decoration:none}.excerpt{margin-top:8px;font-family:Georgia,serif;line-height:1.55}
    form{position:sticky;bottom:16px;margin-top:24px;background:#fff;border:1px solid #dfd2bf;border-radius:18px;padding:10px;display:flex;gap:8px;box-shadow:0 12px 40px rgba(40,20,0,.12)}
    textarea{flex:1;border:0;outline:0;resize:none;padding:12px;font:inherit;min-height:50px;background:transparent}
    button{border:0;background:#3b2818;color:#fff;border-radius:12px;padding:0 20px;font-weight:700;cursor:pointer}
    .status{text-align:center;font-size:13px;opacity:.65;margin-top:8px}.small{font-size:12px;opacity:.68}
  </style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>🪷 Bhajan Marg AI</h1>
    <div class="sub">Search the indexed satsang corpus on every question. AI explanations are not Premanand Ji.</div>
  </div>
  <div id="chat" class="chat"></div>
  <form id="form">
    <textarea id="q" placeholder="अपना प्रश्न पूछें..." required></textarea>
    <button>Ask</button>
  </form>
  <div id="status" class="status"></div>
</div>
<script>
let conversationId = localStorage.getItem("bm_conversation") || null;
const chat = document.getElementById("chat");
const form = document.getElementById("form");
const q = document.getElementById("q");
const status = document.getElementById("status");

function esc(s){const d=document.createElement("div");d.textContent=s||"";return d.innerHTML}
function badge(level){
  if(level==="direct") return "Strong / direct corpus evidence";
  if(level==="related") return "Related teaching — not a direct answer";
  return "No sufficient Bhajan Marg citation found";
}
function addUser(t){chat.insertAdjacentHTML("beforeend",`<div class="msg user">${esc(t)}</div>`)}
function addAI(data){
  let sources="";
  for(const s of data.sources||[]){
    sources += `<div class="source">
      <div><a target="_blank" href="${esc(s.url)}">▶ ${esc(s.title)}</a></div>
      <div class="small">${esc(s.start)}–${esc(s.end)} · relevance ${esc(String(s.relevance))}</div>
      <div class="excerpt">“${esc(s.transcript_excerpt)}”</div>
      <div class="small">Transcript-derived excerpt; auto-captions may contain recognition errors.</div>
    </div>`;
  }
  chat.insertAdjacentHTML("beforeend",`<div class="msg ai">
    <div class="badge">${esc(badge(data.evidence_level))}</div>
    <div>${esc(data.answer)}</div>${sources}
  </div>`);
  window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});
}
form.addEventListener("submit", async e=>{
  e.preventDefault(); const text=q.value.trim(); if(!text)return;
  addUser(text); q.value=""; status.textContent="Searching the corpus again…";
  try{
    const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({question:text,conversation_id:conversationId})});
    if(!r.ok) throw new Error(await r.text());
    const data=await r.json();
    conversationId=data.conversation_id;
    localStorage.setItem("bm_conversation",conversationId);
    addAI(data);
    status.textContent=`Search query: ${data.standalone_query}`;
  }catch(err){status.textContent="Error: "+err.message}
});
</script>
</body>
</html>
