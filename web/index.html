<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bhajan Marg AI</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:#fbf7ef;color:#23180f}
    .wrap{max-width:920px;margin:0 auto;padding:32px 18px 80px}.hero{text-align:center;margin:20px 0 34px}
    h1{font-size:38px;margin:0}.sub{opacity:.7;margin-top:8px}.chat{display:flex;flex-direction:column;gap:18px}
    .msg{padding:18px 20px;border-radius:18px;line-height:1.65;white-space:pre-wrap}.user{align-self:flex-end;background:#3b2818;color:#fff;max-width:75%}
    .ai{background:#fff;border:1px solid #eadfce;box-shadow:0 8px 30px rgba(60,35,12,.05)}
    .badge{font-size:12px;font-weight:700;display:inline-block;padding:5px 9px;border-radius:999px;margin-bottom:10px;background:#f1e3c9}
    .source{margin-top:12px;padding:14px;background:#fffaf0;border:1px solid #ead9b8;border-radius:14px}
    .source a{color:#8c4b00;font-weight:700;text-decoration:none}.excerpt{margin-top:8px;font-family:Georgia,serif;line-height:1.55}
    form{position:sticky;bottom:16px;margin-top:24px;background:#fff;border:1px solid #dfd2bf;border-radius:18px;padding:10px;display:flex;gap:8px;box-shadow:0 12px 40px rgba(40,20,0,.12)}
    textarea{flex:1;border:0;outline:0;resize:none;padding:12px;font:inherit;min-height:50px;background:transparent}
    button{border:0;background:#3b2818;color:#fff;border-radius:12px;padding:0 20px;font-weight:700;cursor:pointer}
    button:disabled{opacity:.6;cursor:not-allowed}.status{text-align:center;font-size:13px;opacity:.65;margin-top:8px}.small{font-size:12px;opacity:.68}
  </style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>🪷 Bhajan Marg AI</h1>
    <div class="sub">Search the indexed satsang corpus on every question. AI explanations are not Premanand Ji.</div>
  </div>
  <button id="new-chat" type="button" style="padding:10px 16px;margin-bottom:14px">नई बातचीत</button>
  <div id="chat" class="chat"></div>
  <form id="form">
    <textarea aria-label="अपना प्रश्न पूछें" id="q" placeholder="अपना प्रश्न पूछें..." required></textarea>
    <button id="ask">Ask</button>
  </form>
  <div id="status" class="status" role="status" aria-live="polite"></div>
</div>
<script src="./config.js"></script>
<script src="./app.js"></script>
</body>
</html>
